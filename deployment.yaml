apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-kind-demo
  labels:
    app: java-kind-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: java-kind-demo
  template:
    metadata:
      labels:
        app: java-kind-demo
    spec:
      containers:
        - name: java-kind-demo
          image: java-kind-demo:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 15
